# Gradle 运行参数
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft / Fabric 版本
# 26.3 是 Minecraft 版本号，不是本模组的版本号
# 26.3 的官方 JAR 已未混淆，Loom 使用 identity 映射，因此无需 mappings 配置
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.4
fabric_api_version=0.166.2+26.3

# 依赖版本
zxing_version=3.5.3

# 模组属性
# 发布通道：Alpha / Beta / Release，配合 mod_version 组成 Alpha_0.0.1 这类产物名
mod_channel=Alpha
mod_version=0.0.1
archives_base_name=Minecraft-DG-LAB-Connect-26.3-Fabric
group=cn.dancingsnow
