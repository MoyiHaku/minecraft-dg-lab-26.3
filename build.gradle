plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// 产物名：Minecraft-DG-LAB-Connect-26.3-Fabric-<通道>_<版本>，例如 ...-Beta_0.0.1.jar
// 26.3 是 Minecraft 版本，模组自身版本只由 mod_version 决定。
def channel = (project.findProperty('mod_channel') ?: 'Release').toString()
def modVersion = (project.findProperty('mod_version') ?: '0.0.1').toString()

version = "${channel}_${modVersion}"

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Minecraft 26.3 的官方 JAR 已未混淆，Loom 使用 identity 映射，
	// 因此这里不需要（也不存在）mappings 声明，依赖也不需要经过 remap。
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 二维码编码库：编译期依赖 + jar-in-jar 打包（产物内 META-INF/jars）
	implementation "com.google.zxing:core:${project.zxing_version}"
	include "com.google.zxing:core:${project.zxing_version}"
}

processResources {
	// Fabric 只接受语义化版本，因此清单里写 0.0.1-alpha，文件名保留 Alpha_0.0.1
	def semver = "${modVersion}-${channel.toLowerCase(Locale.ROOT)}"
	inputs.property "version", semver

	filesMatching("fabric.mod.json") {
		expand "version": semver
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// 需要发布时在此添加仓库
	}
}
